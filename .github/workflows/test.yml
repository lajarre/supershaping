name: supershaping tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pi
        run: npm install -g @mariozechner/pi-coding-agent

      - name: Run Structural Tests
        run: ./test/run-all.sh --structural --verbose

      - name: Run Knowledge Tests
        if: env.ANTHROPIC_API_KEY != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PI_TEST_MODELS: "anthropic/claude-3-5-sonnet:high"
        run: ./test/run-all.sh --knowledge --verbose

      - name: Run Integration Tests
        if: env.ANTHROPIC_API_KEY != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PI_TEST_MODELS: "anthropic/claude-3-5-sonnet:high"
        run: ./test/run-all.sh --integration
